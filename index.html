<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfabet</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: #f2f2f2;

    display: flex;

  }

      linear-gradient(#5c5c5c, #5c5c5c),
      linear-gradient(#e23b3b, #e23b3b),
      linear-gradient(#6e6e6e, #6e6e6e),
      linear-gradient(#e23b3b, #e23b3b),
      linear-gradient(#9a9a9a, #9a9a9a),
      linear-gradient(#e23b3b, #e23b3b),
      linear-gradient(#4a4a4a, #4a4a4a),
      linear-gradient(#ff7e7e, #ff7e7e),

  #top {
    position: relative;
    z-index: 8;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 8px 6px;
    background: #000;

  #layout, #lang, #abc, #pronounce { display: flex; flex-wrap: wrap; gap: 4px; }

  #abc { flex-basis: 100%; }
  #layout button, #lang button, #abc button, #pronounce button {

    color: #9a9a9a;
    border: 1px solid #333;
    font: inherit;
    font-size: 12px;
    padding: 4px 7px;

  #layout button.on, #lang button.on, #abc button.on, #pronounce button.on {

  #app {

  header {

  #left { color: #d7d7d7; padding-right: 6px; }
  #reset {

    height: 36px;

  main {
    flex: 1;
    display: flex;
    align-items: center;

  #stage {

  #options-toggle {

  #tools {

    color: #ffb4b4;

  #speed {

  .key.reveal:active {
    border-color: #111;
    background: #fff;
    color: #111;
    box-shadow: 0 0 0 3px #fff, 0 0 18px #fff;

  .key.reveal .glyph,
  .key.bad .hint,

<script>
"use strict";

const STORAGE = "alfabet-koch";
const LANGS = ["pl", "en", "de", "it"];
const RATE_MIN = 0.7;
const RATE_MAX = 1.2;

function prep(def) {
  const n = def.letters.length;
  const seen = new Set();
  const ks = new Set();
  for (const letter of def.letters) {
    if (seen.has(letter.ch) || ks.has(letter.k)) throw new Error("zły alfabet " + def.id + " " + letter.ch);
    seen.add(letter.ch);
    ks.add(letter.k);
    if (!letter.say) letter.say = letter.hint;
  }
  for (let i = 0; i < n; i++) {
    if (!ks.has(i)) throw new Error("luka " + def.id + " " + i);
  }
  const by = {};
  for (const letter of def.letters) by[letter.ch] = letter;
  const koch = def.letters.slice().sort((a, b) => a.k - b.k).map((letter) => letter.ch);
  const alpha = def.letters.map((letter) => letter.ch);
  const keyset = new Set(def.keys.flat());
  for (const ch of koch) {
    if (!keyset.has(ch)) throw new Error("brak klawisza " + def.id + " " + ch);
  }
  return { id: def.id, bcp: def.bcp, by, koch, alpha, keys: def.keys, length: n };
}

  de: prep({

function clipSlug(text) {
  let out = "";
  for (const ch of String(text).toLowerCase()) {
    const c = ch.codePointAt(0);
    if ((c >= 97 && c <= 122) || (c >= 48 && c <= 57)) out += ch;
    else if (ch === " ") out += "_";
    else if (ch === "-") out += "-";
    else out += "u" + c.toString(16);
  }
  return out || "x";
}

};

function fill(s, vars) {
  return s.replace(/\{(\w+)\}/g, (_, key) => (vars && vars[key] != null ? vars[key] : ""));
}

function t(key, vars) {
  const pack = COPY[state.lang] || COPY.pl;
  const value = pack[key];
  return typeof value === "string" ? fill(value, vars) : value;
}

let state = load();

let queue = [];
let correct = 0;
let total = 0;

let timer = 0;
let repeatTimer = 0;
let resetArm = 0;
let ctx = null;
let player = null;
let speakId = 0;
let speakStarted = 0;
let drillList = [];

function abc() {
  return ALPHABETS[state.alphabet];
}

function prog() {
  return state.progress[state.alphabet];
}

function isGate(count) {
  return count >= 6 && (count - 2) % 4 === 0;
}

function passed(ok, n) {
  return n > 0 && ok * 10 >= n * 9;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

function lessonQueue(list) {
  const newest = list[list.length - 1];
  const older = list.slice(0, -1);
  const out = [];
  for (let i = 0; i < 10; i++) {
    const pick = older.length && Math.random() >= 0.5
      ? older[Math.floor(Math.random() * older.length)]
      : newest;
    out.push({ char: pick, retry: false });
  }
  return out;
}

function examQueue(list) {
  const order = shuffle(list.slice());
  const bag = [];
  for (let i = 0; i < 20; i++) bag.push({ char: order[i % order.length], retry: false });
  return shuffle(bag);
}

function drillQueue(list) {
  const order = shuffle(list.slice());
  const bag = [];
  for (let i = 0; i < 10; i++) bag.push({ char: order[i % order.length], retry: false });
  return shuffle(bag);
}

function chars() {
  return abc().koch.slice(0, prog().count);
}

function levelMarks(len) {
  const out = [];
  for (let n = 2; n <= len; n += 4) out.push(n);
  if (out[out.length - 1] !== len) out.push(len);
  return out;
}

function cleanDrill(raw, id) {
  const pack = ALPHABETS[id];
  if (!pack || !Array.isArray(raw)) return [];
  const seen = new Set();
  const out = [];
  for (const ch of raw) {
    if (typeof ch !== "string" || !pack.by[ch] || seen.has(ch)) continue;
    seen.add(ch);
    out.push(ch);
  }
  out.sort((a, b) => pack.koch.indexOf(a) - pack.koch.indexOf(b));
  return out;
}

function freshProgress() {
  return { count: 2, pendingExam: false, finished: false, drill: [] };
}

function cleanProgress(raw, id) {
  const len = ALPHABETS[id].length;
  if (!raw || typeof raw !== "object") return freshProgress();
  const count = Math.round(Number(raw.count));
  if (!(count >= 2 && count <= len)) return freshProgress();
  const pendingExam = Boolean(raw.pendingExam) && isGate(count);
  const finished = Boolean(raw.finished) && count === len && !pendingExam;
  return { count, pendingExam, finished, drill: cleanDrill(raw.drill, id) };
}

function load() {
  const def = {
    alphabet: "pl",
    lang: "pl",
    rate: 1,
    repeatSec: 2,
    auto: false,
    soundBad: true,
    soundOk: false,
    hideMap: false,
    wideKeys: false,
    optionsOpen: true,
    layout: "alpha",
    pronounce: "adapt",
    speechApi: false,
    progress: {
      pl: freshProgress(),
      en: freshProgress(),
      de: freshProgress(),
      it: freshProgress()
    }
  };
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE) || "null");
    if (!raw || typeof raw !== "object") return def;
    const alphabet = LANGS.includes(raw.alphabet) ? raw.alphabet : "pl";
    const lang = LANGS.includes(raw.lang) ? raw.lang : "pl";
    const layout = raw.layout === "keys" ? "keys" : "alpha";
    let rate = Number(raw.rate);
    if (!Number.isFinite(rate)) rate = 1;
    rate = Math.round(clamp(rate, RATE_MIN, RATE_MAX) * 10) / 10;
    let repeatSec = Number(raw.repeatSec);
    if (!Number.isFinite(repeatSec)) repeatSec = 2;
    repeatSec = clamp(Math.round(repeatSec * 2) / 2, 0.5, 10);
    const stored = raw.progress && typeof raw.progress === "object" ? raw.progress : {};
    const progress = {};
    for (const id of LANGS) progress[id] = cleanProgress(stored[id], id);
    return {
      alphabet, lang, rate, repeatSec, layout, progress,
      auto: Boolean(raw.auto),
      soundBad: raw.soundBad === undefined ? true : Boolean(raw.soundBad),
      soundOk: Boolean(raw.soundOk),
      hideMap: Boolean(raw.hideMap),
      wideKeys: Boolean(raw.wideKeys),
      optionsOpen: raw.optionsOpen === undefined ? true : Boolean(raw.optionsOpen),
      pronounce: raw.pronounce === "native" ? "native" : "adapt",
      speechApi: Boolean(raw.speechApi)
    };
  } catch (err) {
    return def;
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify(state));
  } catch (err) {}
}

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function canon(raw) {
  if (!raw || typeof raw !== "string") return "";
  const map = abc().by;
  if (map[raw]) return raw;
  if (raw === "ß" || raw === "ẞ") return map["ß"] ? "ß" : "";
  const up = raw.toUpperCase();
  return map[up] ? up : "";
}

function audioCtx() {
  if (ctx && ctx.state === "closed") ctx = null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("no audio");
    ctx = new AC();
  }
  return ctx;
}

function stopPlayer() {
  if (!player) return;
  player.onended = null;
  player.onerror = null;
  player.onloadedmetadata = null;
  try { player.pause(); } catch (err) {}
}

function stopSpeak() {
  speakId += 1;
  speakStarted = 0;
  clearRepeat();
  app.classList.remove("playing");
  stopPlayer();
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (err) {}
  }
}

function cueFor(ch) {
  const letter = abc().by[ch];
  if (!letter) return null;
  const ui = state.lang;
  if (state.pronounce === "adapt" && letter.adapt && letter.adapt[ui]) {
    return { text: letter.adapt[ui], bcp: UI_BCP[ui] };
  }
  return { text: letter.say, bcp: abc().bcp };
}

function labelFor(letter) {
  if (!letter) return "";
  const ui = state.lang;
  if (state.pronounce === "adapt" && letter.adapt && letter.adapt[ui]) return letter.adapt[ui];
  return letter.hint;
}

function speakLang() {
  if (state.pronounce === "adapt" && state.lang !== state.alphabet) return UI_BCP[state.lang];
  return abc().bcp;
}

function clipUrl(bcp, text) {
  return "audio/" + bcp.slice(0, 2) + "/" + clipSlug(text) + ".mp3";
}

function voiceFor(bcp) {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  const want = bcp.toLowerCase();
  const prefix = want.slice(0, 2);
  let loose = null;
  for (const voice of voices) {
    const lang = (voice.lang || "").toLowerCase().replace("_", "-");
    if (lang === want) return voice;
    if (!loose && lang.startsWith(prefix)) loose = voice;
  }
  return loose;
}

function makeUtterance(cue, id, onfail) {
  const u = new SpeechSynthesisUtterance(cue.text);
  u.lang = cue.bcp;
  u.rate = state.rate;
  const voice = voiceFor(cue.bcp);
  if (voice) u.voice = voice;
  u.onstart = () => {
    if (id !== speakId) return;
    speakStarted = id;
    app.classList.add("playing");
  };
  u.onend = () => endSpeak(id);
  u.onerror = () => {
    if (id !== speakId) return;
    if (speakStarted === id) endSpeak(id);
    else if (onfail) onfail();
  };
  return u;
}

function playFile(id, cue) {
  if (!player) player = new Audio();
  stopPlayer();
  player.src = clipUrl(cue.bcp, cue.text);
  player.onended = () => {
    if (id !== speakId) return;
    speakStarted = id;
    endSpeak(id);
  };
  player.onerror = () => {
    if (id !== speakId) return;
    app.classList.remove("playing");
  };
  player.onloadedmetadata = () => {
    if (id !== speakId) return;
    try { player.playbackRate = state.rate; } catch (err) {}
  };
  app.classList.add("playing");
  const started = player.play();
  if (started && started.catch) {
    started.catch(() => {
      if (id === speakId) app.classList.remove("playing");
    });
  }
}

function playChar(ch) {
  clearRepeat();
  const id = ++speakId;
  speakStarted = 0;
  app.classList.remove("playing");
  const cue = cueFor(ch);
  if (!cue) return;
  stopPlayer();
  const synth = window.speechSynthesis;
  if (synth) {
    try { synth.cancel(); } catch (err) {}
  }
  const useApi = state.speechApi && synth && voiceFor(cue.bcp);
  if (!useApi) {
    playFile(id, cue);
    return;
  }
  setTimeout(() => {
    if (id !== speakId) return;
    try {
      synth.speak(makeUtterance(cue, id, () => playFile(id, cue)));
      if (synth.paused) synth.resume();
    } catch (err) {
      playFile(id, cue);
    }
  }, 50);
}

function endSpeak(id) {
  if (id !== speakId) return;
  app.classList.remove("playing");
  if (!state.auto || phase !== "ask" || !queue.length) return;
  clearRepeat();
  repeatTimer = setTimeout(() => {
    if (id !== speakId || phase !== "ask" || !state.auto || !queue.length) return;
    playChar(queue[0].char);
  }, state.repeatSec * 1000);
}

function blip(freq, when, dur, type, peak) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.008);
  g.gain.linearRampToValueAtTime(0, when + dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(when);
  o.stop(when + dur + 0.02);
}

function playResult(ok) {
  if (ok ? !state.soundOk : !state.soundBad) return;
  let actx;
  try { actx = audioCtx(); } catch (err) { return; }
  if (actx.state !== "running") {
    const resume = actx.resume();
    if (resume && typeof resume.then === "function") resume.then(() => playResult(ok), () => {});
    return;
  }
  const t0 = actx.currentTime + 0.02;
  if (ok) {
    blip(740, t0, 0.07, "sine", 0.12);
    blip(1040, t0 + 0.08, 0.1, "sine", 0.1);
  } else {
    blip(196, t0, 0.1, "square", 0.05);
    blip(130, t0 + 0.11, 0.16, "square", 0.06);
  }
}

function renderHeader() {
  const name = t("name_" + state.alphabet);
  let label = t("level", { n: prog().count - 1 });
  if (roundMode === "exam" || roundMode === "drillExam" || (phase === "overlay" && prog().pendingExam && roundMode !== "drill" && roundMode !== "practice")) label = t("exam");
  if (roundMode === "practice") label = t("practice");
  if (roundMode === "drill") label = t("picked");
  if (prog().finished && roundMode !== "lesson" && roundMode !== "exam" && roundMode !== "practice" && roundMode !== "drill" && roundMode !== "drillExam") label = t("fullSet");
  modeEl.textContent = name + " · " + label;
  const live = phase === "ask" || phase === "feedback";
  leftEl.textContent = live ? t("left", { n: queue.length }) : "";
}

function renderBoard(exam) {
  board.classList.toggle("board-exam", !!exam);
  board.classList.toggle("board-nomap", state.hideMap);
  board.replaceChildren();
  const known = new Set(roundMode === "drill" || roundMode === "drillExam" ? drillList : chars());
  const pack = abc();
  const rows = state.layout === "keys" ? pack.keys : chunk(pack.alpha, 10);
  for (const row of rows) {
    const line = document.createElement("div");
    line.className = "row";
    for (const ch of row) line.appendChild(keyButton(ch, known.has(ch)));
    board.appendChild(line);
  }
}

function chunk(list, size) {
  const rows = [];
  for (let i = 0; i < list.length; i += size) rows.push(list.slice(i, i + size));
  return rows;
}

function keyButton(ch, inSet) {
  const letter = abc().by[ch];
  const btn = document.createElement("button");
  btn.type = "button";
  btn.dataset.ch = ch;
  const hiddenName = board.classList.contains("board-exam") || board.classList.contains("board-nomap");
  if (!letter) {
    btn.className = "key ghost";
    btn.tabIndex = -1;
    btn.setAttribute("aria-hidden", "true");
  } else {
    btn.className = "key" + (inSet ? " in-set" : "");
    const name = labelFor(letter);
    btn.setAttribute("aria-label", hiddenName ? ch : ch + ", " + name);
  }
  const glyph = document.createElement("span");
  glyph.className = "glyph";
  glyph.textContent = ch;
  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = letter ? labelFor(letter) : "";
  btn.append(glyph, hint);
  return btn;
}

function clearMarks() {
  for (const key of board.querySelectorAll(".key")) {
    key.classList.remove("good", "bad", "reveal");
  }
}

function markKeys(pressed, actual, ok) {
  for (const key of board.querySelectorAll(".key")) {
    const ch = key.dataset.ch;
    key.classList.toggle("bad", !ok && ch === pressed);
    key.classList.toggle("good", ok && ch === actual);
    key.classList.toggle("reveal", !ok && ch === actual);
  }
}

function clearRepeat() {
  clearTimeout(repeatTimer);
}

function paintIntro() {
  const intro = overlayView && (overlayView.kind === "start" || overlayView.kind === "examStart" || overlayView.kind === "done");
  const drillOver = overlayView && overlayView.kind === "drillAgain";
  unlockCard.hidden = !(intro && !prog().finished);
  aboutCard.hidden = !intro;
  pickCard.hidden = !(intro || drillOver);
  unlockBtn.hidden = prog().finished;
  levelBack.hidden = !drillOver;
  if (drillOver) levelBack.textContent = t("ownLevel");
}

function paintOverlay() {
  if (!overlayView) return;
  const v = overlayView.vars;
  let title = t("name_" + state.alphabet);
  let text = "";
  let button = t("next");
  if (overlayView.kind === "start") {
    text = t("startText", v);
    button = t("start");
  } else if (overlayView.kind === "examStart") {
    title = t("exam");
    text = t("examText", v);
    button = t("start");
  } else if (overlayView.kind === "done") {
    title = t("fullSet");
    text = t("doneText");
    button = t("practiceBtn");
  } else if (overlayView.kind === "fail") {
    title = t("fail");
    text = t("failText", v);
    button = t("again");
  } else if (overlayView.kind === "passExam") {
    title = t("pass");
    text = t("examNext", v);
  } else if (overlayView.kind === "drillAgain") {
    title = v.pass ? t("pass") : t("fail");
    text = v.ratio;
    button = t("again");
  } else if (overlayView.kind === "passDone" || overlayView.kind === "practice") {
    title = v.pass ? t("pass") : t("fail");
    text = overlayView.kind === "passDone" ? t("fullResult", v) : v.ratio;
  } else if (overlayView.kind === "passNew") {
    title = t("pass");
    text = t("newChar", v);
  }
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  overlayBtn.textContent = button;
  paintIntro();
}

function showOverlay(kind, vars, action) {
  overlayView = { kind, vars: vars || {}, action };
  overlay.hidden = false;
  phase = "overlay";
  paintOverlay();
  renderHeader();
  overlayBtn.focus();
}

function hideOverlay() {
  overlay.hidden = true;
  if (document.activeElement === overlayBtn) overlayBtn.blur();
}

function showStart() {
  roundMode = "";
  queue = [];
  phase = "overlay";
  clearTimeout(timer);
  clearRepeat();
  stopSpeak();
  renderBoard(prog().pendingExam);
  if (prog().finished) showOverlay("done", {}, startPractice);
  else if (prog().pendingExam) showOverlay("examStart", { n: prog().count }, startExam);
  else showOverlay("start", { n: prog().count - 1 }, startLesson);
}

function showDone() {
  roundMode = "";
  queue = [];
  clearTimeout(timer);
  clearRepeat();
  stopSpeak();
  renderBoard(false);
  showOverlay("done", {}, startPractice);
}

function begin(nextQueue, exam) {
  queue = nextQueue;
  correct = 0;
  total = 0;
  hideOverlay();
  renderBoard(exam);
  ask();
}

function startLesson() {
  roundMode = "lesson";
  begin(lessonQueue(chars()), false);
}

function startExam() {
  roundMode = "exam";
  begin(examQueue(chars()), true);
}

function startPractice() {
  roundMode = "practice";
  begin(lessonQueue(chars()), false);
}

function ask() {
  clearMarks();
  if (!queue.length) {
    finishRound();
    return;
  }
  phase = "ask";
  renderHeader();
  playChar(queue[0].char);
}

function onAnswer(raw) {
  if (phase !== "ask") return;
  const ch = canon(raw);
  if (!ch) return;
  phase = "feedback";
  clearRepeat();
  stopSpeak();
  const q = queue.shift();
  const ok = ch === q.char;
  playResult(ok);
  total += 1;
  if (ok) correct += 1;
  markKeys(ch, q.char, ok);
  if (!ok && !q.retry && roundMode !== "exam" && roundMode !== "drillExam") {
    const at = Math.min(queue.length, 2);
    queue.splice(at, 0, { char: q.char, retry: true });
  }
  renderHeader();
  clearTimeout(timer);
  timer = setTimeout(ask, ok ? 280 : 780);
}

function commit() {
  const cur = prog();
  const len = abc().length;
  if (roundMode === "exam") {
    cur.pendingExam = false;
    if (cur.count < len) cur.count += 1;
    else cur.finished = true;
  } else if (roundMode === "lesson") {
    if (isGate(cur.count)) cur.pendingExam = true;
    else if (cur.count < len) cur.count += 1;
    else cur.finished = true;
  }
  save();
}

function repeatPicked() {
  const exam = roundMode === "drillExam";
  const list = drillList.slice();
  if (!list.length) {
    showStart();
    return;
  }
  roundMode = exam ? "drillExam" : "drill";
  begin(exam ? examQueue(list) : drillQueue(list), exam);
}

function finishRound() {
  phase = "overlay";
  clearRepeat();
  stopSpeak();
  clearMarks();
  const pass = passed(correct, total);
  if (pass && roundMode !== "practice" && roundMode !== "drill" && roundMode !== "drillExam") commit();
  const ratio = correct + "/" + total;
  if (roundMode === "drill" || roundMode === "drillExam") {
    showOverlay("drillAgain", { pass, ratio }, repeatPicked);
  } else if (roundMode === "practice") {
    showOverlay("practice", { pass, ratio }, showStart);
  } else if (!pass) {
    const again = roundMode === "exam" ? startExam : startLesson;
    showOverlay("fail", { ratio }, again);
  } else if (prog().pendingExam) {
    showOverlay("passExam", { ratio }, startExam);
  } else if (prog().finished) {
    showOverlay("passDone", { ratio, pass: true }, showDone);
  } else {
    const ch = abc().koch[prog().count - 1];
    showOverlay("passNew", { ratio, ch, hint: labelFor(abc().by[ch]) }, startLesson);
  }
}

function replay() {
  if (phase !== "ask" || !queue.length) return;
  playChar(queue[0].char);
}

function doReset() {
  clearTimeout(timer);
  clearRepeat();
  stopSpeak();
  state.progress[state.alphabet] = freshProgress();
  save();
  showStart();
}

function unlockAll() {
  clearTimeout(timer);
  clearRepeat();
  stopSpeak();
  aboutEl.hidden = true;
  const cur = prog();
  cur.count = abc().length;
  cur.pendingExam = false;
  cur.finished = true;
  save();
  showDone();
}

function renderAbout() {
  const pack = COPY[state.lang] || COPY.pl;
  aboutBack.textContent = pack.back;
  aboutTitle.textContent = pack.aboutTitle;
  aboutBody.replaceChildren();
  for (const section of pack.aboutSections) {
    const h = document.createElement("h2");
    h.textContent = section[0];
    const p = document.createElement("p");
    p.textContent = section[1];
    aboutBody.append(h, p);
  }
}

function openAbout() {
  clearRepeat();
  stopSpeak();
  renderAbout();
  aboutEl.hidden = false;
  aboutBack.focus();
}

function closeAbout() {
  aboutEl.hidden = true;
  resumeAsk();
}

function selectedChars() {
  const out = [];
  for (const input of pickChars.querySelectorAll("input")) {
    if (input.checked) out.push(input.value);
  }
  return out;
}

function syncPickGo() {
  const selected = selectedChars();
  pickGo.disabled = selected.length === 0;
  pickExam.disabled = selected.length === 0;
  const order = abc().koch;
  const prefix = selected.length > 0 && selected.every((ch, i) => ch === order[i]);
  const match = prefix ? selected.length : 0;
  for (const btn of pickLevels.querySelectorAll("button")) {
    btn.classList.toggle("on", Number(btn.dataset.n) === match);
  }
}

function setPick(list) {
  const want = new Set(list);
  for (const input of pickChars.querySelectorAll("input")) {
    input.checked = want.has(input.value);
    input.parentElement.classList.toggle("on", input.checked);
  }
  syncPickGo();
}

function buildPick() {
  pickLevels.replaceChildren();
  pickChars.replaceChildren();
  const pack = abc();
  for (const n of levelMarks(pack.length)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.n = String(n);
    btn.textContent = String(n);
    pickLevels.appendChild(btn);
  }
  for (const ch of pack.koch) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = ch;
    const span = document.createElement("span");
    span.textContent = ch;
    label.append(input, span);
    input.addEventListener("change", () => {
      label.classList.toggle("on", input.checked);
      syncPickGo();
    });
    pickChars.appendChild(label);
  }
}

function paintPick() {
  pickBack.textContent = t("back");
  pickTitle.textContent = t("pickTitle");
  pickHint.textContent = t("pickHint");
  pickLevelsLabel.textContent = t("levels");
  pickAll.textContent = t("allChars");
  pickClear.textContent = t("clearChars");
  pickGo.textContent = t("drillGo");
  pickExam.textContent = t("exam");
}

function openPick() {
  clearRepeat();
  stopSpeak();
  buildPick();
  setPick(prog().drill.length ? prog().drill : chars());
  paintPick();
  pickEl.hidden = false;
  pickBack.focus();
}

function closePick() {
  pickEl.hidden = true;
  resumeAsk();
}

function resumeAsk() {
  if (phase === "ask" && queue.length && aboutEl.hidden && pickEl.hidden) {
    playChar(queue[0].char);
  }
}

function beginPicked(mode, exam) {
  const picked = selectedChars();
  if (!picked.length) return;
  prog().drill = picked;
  save();
  drillList = picked.slice();
  roundMode = mode;
  pickEl.hidden = true;
  aboutEl.hidden = true;
  begin(exam ? examQueue(picked) : drillQueue(picked), exam);
}

function startDrill() {
  beginPicked("drill", false);
}

function startLevelExam() {
  beginPicked("drillExam", true);
}

function paintOptions() {
  const open = state.optionsOpen !== false;
  const box = document.getElementById("options");
  const btn = document.getElementById("options-toggle");
  box.hidden = !open;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.textContent = t("options") + (open ? " ▾" : " ▸");
}

let voicesReady = false;

function paintVoice() {
  voiceNote.textContent = t("voiceNote");
  if (!state.speechApi) {
    voiceNote.hidden = true;
    return;
  }
  const synth = window.speechSynthesis;
  if (!synth) {
    voiceNote.hidden = false;
    return;
  }
  const voices = synth.getVoices();
  if (!voices.length && !voicesReady) {
    voiceNote.hidden = true;
    return;
  }
  voiceNote.hidden = !!voiceFor(speakLang());
}

function paintSwitches() {
  for (const btn of layoutBar.querySelectorAll("button")) {
    const on = btn.dataset.layout === state.layout;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = btn.dataset.layout === "keys" ? t("layoutKeys") : t("layoutAlpha");
  }
  for (const btn of abcBar.querySelectorAll("button")) {
    const on = btn.dataset.abc === state.alphabet;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = t("name_" + btn.dataset.abc);
  }
  for (const btn of langBar.querySelectorAll("button")) {
    btn.classList.toggle("on", btn.dataset.lang === state.lang);
  }
  for (const btn of pronBar.querySelectorAll("button")) {
    const on = btn.dataset.pron === state.pronounce;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = btn.dataset.pron === "native" ? t("pronNative") : t("pronAdapt");
  }
}

function measureTop() {
  document.documentElement.style.setProperty("--top-h", topEl.offsetHeight + "px");
}

function applyLang() {
  const pack = COPY[state.lang] || COPY.pl;
  document.documentElement.lang = state.lang;
  document.title = pack.title;
  document.getElementById("prompt").textContent = pack.prompt;
  replayBtn.textContent = pack.replay;
  document.getElementById("auto-label").textContent = pack.auto;
  document.getElementById("sound-bad-label").textContent = pack.soundBad;
  document.getElementById("sound-ok-label").textContent = pack.soundOk;
  document.getElementById("hide-map-label").textContent = pack.hideMap;
  document.getElementById("wide-keys-label").textContent = pack.wideKeys;
  document.getElementById("speech-api-label").textContent = pack.speechApi;
  document.body.classList.toggle("wide-keys", state.wideKeys);
  aboutOpen.textContent = pack.about;
  aboutCard.textContent = pack.about;
  unlockBtn.textContent = pack.unlock;
  unlockCard.textContent = pack.unlock;
  pickOpen.textContent = pack.pick;
  pickCard.textContent = pack.pick;
  document.getElementById("rate-label").textContent = pack.tempo;
  document.getElementById("repeat-label").textContent = pack.every;
  repeatWrap.hidden = !state.auto;
  resetBtn.title = pack.resetTitle;
  if (!resetArm) resetBtn.textContent = "↺";
  paintSwitches();
  paintVoice();
  renderBoard(board.classList.contains("board-exam"));
  renderHeader();
  if (!overlay.hidden) paintOverlay();
  if (!aboutEl.hidden) renderAbout();
  if (!pickEl.hidden) paintPick();
  paintOptions();
  measureTop();
}

function formatSec(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function syncRate() {
  rateInput.value = String(state.rate);
  rateVal.textContent = state.rate.toFixed(1);
  repeatInput.value = String(state.repeatSec);
  repeatVal.textContent = formatSec(state.repeatSec);
  repeatWrap.hidden = !state.auto;
}

function setAlphabet(id) {
  if (!ALPHABETS[id] || id === state.alphabet) return;
  stopSpeak();
  clearTimeout(timer);
  state.alphabet = id;
  save();
  aboutEl.hidden = true;
  pickEl.hidden = true;
  applyLang();
  showStart();
}

function setLayout(mode) {
  if (mode !== "keys" && mode !== "alpha") return;
  if (mode === state.layout) return;
  state.layout = mode;
  save();
  paintSwitches();
  renderBoard(board.classList.contains("board-exam"));
}

function setPronounce(mode) {
  if (mode !== "native" && mode !== "adapt") return;
  if (mode === state.pronounce) return;
  state.pronounce = mode;
  save();
  paintSwitches();
  paintVoice();
  renderBoard(board.classList.contains("board-exam"));
  if (phase === "ask" && queue.length) playChar(queue[0].char);
}

syncRate();
rateInput.addEventListener("input", () => {
  state.rate = Math.round(clamp(Number(rateInput.value), RATE_MIN, RATE_MAX) * 10) / 10;
  rateVal.textContent = state.rate.toFixed(1);
  save();
});
repeatInput.addEventListener("input", () => {
  state.repeatSec = clamp(Math.round(Number(repeatInput.value) * 2) / 2, 0.5, 10);
  repeatVal.textContent = formatSec(state.repeatSec);
  save();
});

resetBtn.addEventListener("click", () => {
  if (resetArm) {
    resetArm = 0;
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "↺";
    doReset();
    return;
  }
  resetArm = 1;
  resetBtn.classList.add("armed");
  resetBtn.textContent = t("confirm");
  setTimeout(() => {
    if (!resetArm) return;
    resetArm = 0;
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "↺";
  }, 2000);
});

const soundBadInput = document.getElementById("sound-bad");
const soundOkInput = document.getElementById("sound-ok");
soundBadInput.checked = state.soundBad;
soundOkInput.checked = state.soundOk;
soundBadInput.addEventListener("change", () => {
  state.soundBad = soundBadInput.checked;
  save();
});
soundOkInput.addEventListener("change", () => {
  state.soundOk = soundOkInput.checked;
  save();
});
const hideMapInput = document.getElementById("hide-map");
hideMapInput.checked = state.hideMap;
hideMapInput.addEventListener("change", () => {
  state.hideMap = hideMapInput.checked;
  save();
  renderBoard(board.classList.contains("board-exam"));
});
const speechApiInput = document.getElementById("speech-api");
speechApiInput.checked = state.speechApi;
speechApiInput.addEventListener("change", () => {
  state.speechApi = speechApiInput.checked;
  save();
  paintVoice();
  if (phase === "ask" && queue.length) playChar(queue[0].char);
});
const wideKeysInput = document.getElementById("wide-keys");
wideKeysInput.checked = state.wideKeys;
wideKeysInput.addEventListener("change", () => {
  state.wideKeys = wideKeysInput.checked;
  document.body.classList.toggle("wide-keys", state.wideKeys);
  save();
});

autoInput.checked = state.auto;
autoInput.addEventListener("change", () => {
  state.auto = autoInput.checked;
  repeatWrap.hidden = !state.auto;
  save();
  if (!state.auto) clearRepeat();
});

unlockBtn.addEventListener("click", unlockAll);
unlockCard.addEventListener("click", unlockAll);
aboutOpen.addEventListener("click", openAbout);
aboutCard.addEventListener("click", openAbout);
aboutBack.addEventListener("click", closeAbout);
pickOpen.addEventListener("click", openPick);
pickCard.addEventListener("click", openPick);
levelBack.addEventListener("click", () => {
  if (phase !== "overlay") return;
  showStart();
});
pickBack.addEventListener("click", closePick);
pickLevels.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !pickLevels.contains(btn)) return;
  setPick(abc().koch.slice(0, Number(btn.dataset.n)));
});
pickAll.addEventListener("click", () => setPick(abc().koch));
pickClear.addEventListener("click", () => setPick([]));
document.getElementById("options-toggle").addEventListener("click", () => {
  state.optionsOpen = !state.optionsOpen;
  save();
  paintOptions();
});
pickGo.addEventListener("click", startDrill);
pickExam.addEventListener("click", startLevelExam);

langBar.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !COPY[btn.dataset.lang]) return;
  state.lang = btn.dataset.lang;
  save();
  applyLang();
  if (phase === "ask" && queue.length) playChar(queue[0].char);
});
layoutBar.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  setLayout(btn.dataset.layout);
});
pronBar.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  setPronounce(btn.dataset.pron);
});
abcBar.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  setAlphabet(btn.dataset.abc);
});

replayBtn.addEventListener("click", replay);
overlayBtn.addEventListener("click", () => {
  if (phase !== "overlay" || !overlayView) return;
  phase = "starting";
  try { audioCtx().resume(); } catch (err) {}
  overlayView.action();
});
board.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !board.contains(btn) || btn.classList.contains("ghost")) return;
  onAnswer(btn.dataset.ch);
});

window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.repeat) return;
  if (!aboutEl.hidden || !pickEl.hidden) {
    if (e.key === "Escape") {
      if (!aboutEl.hidden) closeAbout();
      else closePick();
    }
    return;
  }
  if (e.target instanceof HTMLButtonElement && (e.key === " " || e.key === "Enter")) return;
  if (phase === "overlay") return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    replay();
    return;
  }
  if (e.key.length === 1) onAnswer(e.key);
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearRepeat();
    stopSpeak();
  } else if (phase === "ask" && queue.length && aboutEl.hidden && pickEl.hidden) {
    playChar(queue[0].char);
  }
});

if (window.speechSynthesis) {
  speechSynthesis.addEventListener("voiceschanged", () => {
    voicesReady = true;
    paintVoice();
    measureTop();
  });
  setTimeout(() => {
    voicesReady = true;
    paintVoice();
    measureTop();
  }, 800);
}

window.addEventListener("resize", measureTop);

applyLang();
showStart();
</script>
</body>
</html>
